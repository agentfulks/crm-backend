version: '3.8'

services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: vc_crm
      POSTGRES_PASSWORD: vc_crm_secret
      POSTGRES_DB: vc_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./schema_phase3.sql:/docker-entrypoint-initdb.d/02-schema_phase3.sql
    command: >
      postgres 
      -c shared_preload_libraries=timescaledb
      -c max_connections=200
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB

  # Redis for caching
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Kafka for event streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vc_crm:vc_crm_secret@postgres:5432/vc_crm
      REDIS_URL: redis://redis:6379
      KAFKA_SERVERS: kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Kafka Consumer for batch ingestion
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      DATABASE_URL: postgresql://vc_crm:vc_crm_secret@postgres:5432/vc_crm
      KAFKA_SERVERS: kafka:9092
      BATCH_SIZE: "1000"
      FLUSH_INTERVAL_MS: "5000"
    depends_on:
      - postgres
      - kafka
    deploy:
      replicas: 3  # Scale consumers horizontally

volumes:
  postgres_data:
  redis_data:
